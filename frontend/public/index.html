<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardian Goggles — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1628;
      color: #e8f4fd;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 520px;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #7ecef4;
    }
    .tagline {
      font-size: 1.1rem;
      color: #a8c8e8;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .status {
      display: inline-block;
      background: #1a3a5c;
      border: 1px solid #2a5a8c;
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.85rem;
      color: #7ecef4;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .note {
      font-size: 0.85rem;
      color: #6a8ea8;
      line-height: 1.6;
    }
    a { color: #7ecef4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏊</div>
    <h1>Guardian Goggles</h1>
    <p class="tagline">
      Session-aware BLE alert layer for residential pools.<br />
      A honest backup signal — not a drowning detector.
    </p>
    <div class="status">Coming soon</div>
    <p class="note">
      The interactive wireframe and app will be deployed here.<br />
      Development is underway — follow the
      <a href="https://github.com/Data-Science-Link/guardian-goggles" target="_blank" rel="noopener">
        GitHub repository
      </a>
      for updates.
    </p>
  </div>
</body>
</html>
