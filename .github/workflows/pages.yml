name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip in-progress runs but do not cancel them.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve everything under frontend/public/
          path: frontend/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# -------------------------------------------------------------------
# MANUAL STEP REQUIRED (one-time, by repo owner):
#
#   GitHub repo → Settings → Pages → Source → "GitHub Actions"
#
# Until that switch is flipped, this workflow will build successfully
# but the deploy step will fail with a 404 / not-configured error.
# The build artifact is still produced and available for inspection.
# -------------------------------------------------------------------
