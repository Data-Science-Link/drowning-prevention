[project]
name = "guardian-goggles"
version = "0.1.0"
description = "Parent-facing drowning-prevention wearable + phone app — BLE session-aware alert system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Michael Link", email = "61164085+Data-Science-Link@users.noreply.github.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardian_goggles"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
